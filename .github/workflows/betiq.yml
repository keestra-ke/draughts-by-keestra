name: Build BetIQ Native
on:
  push:
    paths:
      - 'betiq/**'
      - '.github/workflows/betiq.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
        working-directory: betiq
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - name: Publish BetIQ APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: betiq-${{ github.run_id }}
          name: BetIQ ${{ github.run_id }}
          files: betiq/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: betiq-native-apk
          path: betiq/app/build/outputs/apk/debug/app-debug.apk