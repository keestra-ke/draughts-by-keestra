name: Build Keestra Draughts Native
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
        working-directory: native
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - name: Publish native APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_id }}
          name: Keestra Draughts Native ${{ github.run_id }}
          files: native/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: keestra-native-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk