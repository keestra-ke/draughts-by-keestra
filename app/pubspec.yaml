name: keestra_draughts
description: "Keestra Draughts — Kenyan Nairobi draughts with huffing"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/textures/
    - assets/ui/
    - assets/sounds/